spring.application.name=app-crud

spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:test

spring.datasource.url=jdbc:postgresql://localhost:5432/bankAppCrud
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
# Print every SQL statement Hibernate runs to the console (useful for debugging)
spring.jpa.show-sql=true
# Pretty-print the logged SQL over multiple lines so it is easier to read
spring.jpa.properties.hibernate.format_sql=true