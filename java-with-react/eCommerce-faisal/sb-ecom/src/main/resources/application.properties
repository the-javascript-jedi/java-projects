# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
# Name of this Spring Boot app (shows up in logs and, later, in service discovery/monitoring)
spring.application.name=sb-ecom

# ---------------------------------------------------------------------------
# PostgreSQL datasource (how the app connects to the database)
# ---------------------------------------------------------------------------
# JDBC URL format: jdbc:postgresql://<host>:<port>/<database-name>
#   host     = localhost (database runs on this same machine)
#   port     = 5432 (PostgreSQL default port)
#   database = dvdrental (the database/schema the app will read and write)
spring.datasource.url=jdbc:postgresql://localhost:5432/dvdrental
# Database login credentials
# NOTE: fine for local learning; for real projects use environment variables
# (e.g. ${DB_PASSWORD}) and never commit real passwords to git.
spring.datasource.username=postgres
spring.datasource.password=password

# ---------------------------------------------------------------------------
# JPA / Hibernate (the ORM that maps Java entity classes to DB tables)
# ---------------------------------------------------------------------------
# What Hibernate does with the DB schema on startup:
#   none        = do nothing
#   validate    = only check that tables match the entities
#   update      = create/alter tables to match entities (never drops anything) <- used here
#   create      = drop and recreate tables every start
#   create-drop = like create, plus drop tables on shutdown
# "update" is handy in development; use "validate" or "none" in production.
spring.jpa.hibernate.ddl-auto=update
# Print every SQL statement Hibernate runs to the console (useful for debugging)
spring.jpa.show-sql=true
# Pretty-print the logged SQL over multiple lines so it is easier to read
spring.jpa.properties.hibernate.format_sql=true
