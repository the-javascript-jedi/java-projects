<p>movies-dashboard works!</p>
<div>
  <div class="search">
    <input class="search-box" type="text" name="" id="" placeholder="Search Movies" />
  </div>
  <div class="movies-container">
    <div class="info-banner">Trending this week → becomes "Results for …" after typing</div>
    <div class="movies-list">
      @for (movie of movies(); track movie.id) {
        <a [routerLink]="['/movie', movie.id]">
          <div class="movies-card">
            <div class="">
              <img class="movie-poster" [src]="movie.posterUrl" alt="" />
              <div class="movie-rating-details">
                <div>
                  <span class="year">{{ movie.year }}</span>
                  <span class="rating">★ {{ movie.rating }}</span>
                </div>
                <div>+</div>
              </div>
            </div>
          </div>
        </a>
      } @empty {
        <div>No data found</div>
      }
    </div>
  </div>
</div>
