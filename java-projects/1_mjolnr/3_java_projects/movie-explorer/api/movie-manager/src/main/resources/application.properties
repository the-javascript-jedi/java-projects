# Name of the application ? shown in logs and monitoring tools
spring.application.name=movie-manager

spring.datasource.url=jdbc:mysql://localhost:3306/movies_manager

# MySQL login credentials
spring.datasource.username=root
spring.datasource.password=admin

# MySQL driver class -- tells Spring how to talk to MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Settings ---
# update = auto create/alter tables based on Entity classes on startup
# never use "create" in production -- it drops and recreates all tables
spring.jpa.hibernate.ddl-auto=update

# Print generated SQL in the console -- useful for debugging
spring.jpa.show-sql=true

# Tell Hibernate we are using MySQL so it generates MySQL-compatible SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect