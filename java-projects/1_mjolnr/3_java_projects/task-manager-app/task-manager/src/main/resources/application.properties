spring.application.name=task-manager

# Port the API listens on (the Angular proxy forwards /api to this).
server.port=8080

# MySQL connection — replace the database name, username and password with yours.
# createDatabaseIfNotExist=true creates the "task_manager" database on first run if it's missing.
spring.datasource.url=jdbc:mysql://localhost:3306/task_manager?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin

# "update" lets Hibernate create/alter the "tasks" table from the Task entity automatically.
spring.jpa.hibernate.ddl-auto=update
# Prints the SQL Hibernate runs — handy while learning.
spring.jpa.show-sql=true
